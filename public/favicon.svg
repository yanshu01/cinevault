<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
  <defs>
    <!-- Exact gradient: amber-400 via-rose-500 to-indigo-600 -->
    <linearGradient id="cinevault-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <!-- Rounded container (rounded-2xl) -->
  <rect width="56" height="56" rx="16" fill="url(#cinevault-grad)" />

  <!-- Lucide Film Icon (stroke-[2.5], text-black) -->
  <g transform="translate(14, 14)" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect width="28" height="28" rx="2" ry="2" />
    <line x1="7" y1="0" x2="7" y2="28" />
    <line x1="21" y1="0" x2="21" y2="28" />
    <line x1="0" y1="14" x2="28" y2="14" />
    <line x1="0" y1="7" x2="7" y2="7" />
    <line x1="21" y1="7" x2="28" y2="7" />
    <line x1="0" y1="21" x2="7" y2="21" />
    <line x1="21" y1="21" x2="28" y2="21" />
  </g>
</svg>
